<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ورود | ضبط صدا</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
  <svg xmlns="http://www.w3.org/2000/svg" class="sprite" aria-hidden="true">
    <symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3Z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 19c1.4-3 3.8-4.5 7-4.5S17.6 16 19 19"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-login" viewBox="0 0 24 24"><path d="M14 7V5h5v14h-5v-2M14 12H4M8 9 4 12l4 3"/></symbol>
  </svg>
  <main class="login-card">
    <div class="login-mark" aria-hidden="true"><svg><use href="#i-mic"></use></svg></div>
    <h1>ضبط صدای گوینده</h1>
    <p class="muted lede">جمله مرجع را بشنوید، بخوانید و ضبط کنید.</p>
    <form id="login-form">
      <label>نام کاربری
        <span class="field">
          <svg><use href="#i-user"></use></svg>
          <input id="username" name="username" autocomplete="username" required>
        </span>
      </label>
      <label>رمز
        <span class="field">
          <svg><use href="#i-lock"></use></svg>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </span>
      </label>
      <button type="submit" class="primary"><svg><use href="#i-login"></use></svg>ورود</button>
      <p id="login-error" class="error" hidden></p>
    </form>
  </main>
  <script src="/static/login.js"></script>
</body>
</html>
